server:
  port: 8080

spring:
  # H2 内嵌数据库（demo 用途，生产环境替换为 MySQL）
  datasource:
    url: jdbc:h2:mem:leafdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

sqb:
  # 收钱吧 API 域名（生产环境，无沙盒）
  api-base: https://vsi-api.shouqianba.com

  # 服务商信息（用于终端激活）
  vendor-sn: ${SQB_VENDOR_SN:}
  vendor-key: ${SQB_VENDOR_KEY:}

  # 应用 ID
  app-id: ${SQB_APP_ID:}

  # 终端信息（激活后获得，签到后 terminal-key 会更新）
  terminal-sn: ${SQB_TERMINAL_SN:}
  terminal-key: ${SQB_TERMINAL_KEY:}

  # 设备唯一标识
  device-id: ${SQB_DEVICE_ID:}

logging:
  level:
    com.example.sqbpayment: DEBUG
